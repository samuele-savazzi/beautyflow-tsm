        \ Operazioni eseguite:\n    1. Validazione codice univoco\n    2. Creazione\
        \ Tier con pricing, limits, features\n    3. Gestione dipendenze tier (requires_tiers,\
        \ conflicts_with)\n    4. Audit log\n\n    ### Dipendenze:\n    - `requires_tiers`:\
        \ IDs dei tier che devono essere attivi prima di attivare questo\n    - `conflicts_with`:\
        \ IDs dei tier che non possono essere attivi insieme a questo\n\n    ### Pricing:\n\
        \    - `billing_type`: one_time (acquisto unico), monthly (€/mese), yearly\
        \ (€/anno)\n    - `setup_fee`: Costo iniziale una tantum\n\n    ### Usage\
        \ Limits:\n    - Se `has_usage_limit=True`, specificare `usage_limit` e `usage_unit`\n\
        \    - Esempio: `usage_limit=1000`, `usage_unit='messaggi WhatsApp'`\n    "
