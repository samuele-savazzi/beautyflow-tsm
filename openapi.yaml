                NessunaInconsistenza:
                  value:
                    status: no_inconsistencies
                    inconsistencies: []
                  summary: Nessuna inconsistenza
                InconsistenzeRilevate:
                  value:
                    status: inconsistencies_detected
                    inconsistencies:
                    - type: operator_schedule
                      id: 123
                      operator_id: 45
                      name: Mario Rossi
                      ignore: false
                      period: morning
                      start_time: 08:30
                      end_time: '12:30'
                      date: '2025-07-01'
                    - type: special_closing
