  /admin-api/tenants/{tenant_id}/tiers/activate/:
    post:
      operationId: admin_api_tenants_tiers_activate_create
      description: "\n    **Attiva Tier per un tenant** (solo per role='admin').\n\
        \n    ### Operazioni:\n    1. Verifica che tier esista e sia attivo\n    2.\
        \ Verifica dipendenze (requires_tiers)\n    3. Verifica conflitti (conflicts_with)\n\
        \    4. Crea TenantTier con billing info\n    5. Se is_trial=True, calcola\
        \ trial_ends_at\n    6. Crea audit log\n\n    ### Validazioni:\n    - Tier\
        \ deve essere `is_active=True`\n    - Se tier ha `requires_tiers`, devono\
        \ essere tutti attivi per questo tenant\n    - Se tier ha `conflicts_with`,\
        \ nessuno deve essere attivo per questo tenant\n\n    ### Trial:\n    Se `is_trial=True`:\n\
        \    - `trial_ends_at` = now + tier.trial_days\n    - `expires_at` = trial_ends_at\n\
        \    - Nessun costo\n    "
      parameters:
      - in: path
        name: tenant_id
        schema:
          type: integer
        required: true
      tags:
      - Tenant Tier Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivateTierRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ActivateTierRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ActivateTierRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantTierDetail'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
