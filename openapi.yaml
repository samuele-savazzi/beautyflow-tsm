                      end_time: '12:00'
                    - period: afternoon
                      start_time: '14:00'
                      end_time: '18:00'
                    effective_start_date: '2025-07-01'
                    check_inconsistence_only: false
                    incostence_corrected:
                    - type: operator_schedule
                      id: 123
                      name: Mario Rossi
                      ignore: false
                      period: morning
                      start_time: 08:30
                      end_time: '12:30'
                      date: '2025-07-01'
                  summary: Esempio richiesta completa
                SoloValidazioneInconsistenze:
                  value:
                    area_id: 1
                    day_id: 1
                    timeslot:
                    - period: morning
                      start_time: 08:00
                      end_time: '12:00'
                    effective_start_date: '2025-07-01'
                    check_inconsistence_only: true
