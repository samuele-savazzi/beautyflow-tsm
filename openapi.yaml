components:
  schemas:
    AccountInfo:
      type: object
      properties:
        user_id:
          type: integer
        email:
          type: string
          format: email
        account_nickname:
          type: string
        avatar_color:
          type: string
        last_access:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean
        is_expired:
          type: boolean
        expired_at:
          type: string
          format: date-time
          nullable: true
        days_since_access:
          type: integer
          nullable: true
        device_id:
          type: integer
      required:
      - account_nickname
      - avatar_color
      - days_since_access
      - device_id
      - email
      - expired_at
      - is_active
      - is_expired
      - last_access
      - user_id
    Action55fEnum:
      enum:
      - approve
      - reject
      type: string
      description: |-
        * `approve` - approve
        * `reject` - reject
    ActivateTierRequest:
      type: object
      description: Request per attivare Tier su tenant
      properties:
        tier_id:
          type: integer
          description: ID tier da attivare
        is_trial:
          type: boolean
          default: false
          description: Attiva in modalità trial
        billing_cycle:
          allOf:
          - $ref: '#/components/schemas/ActivateTierRequestBillingCycleEnum'
          default: monthly
          description: |-
            Ciclo billing

            * `monthly` - monthly
            * `yearly` - yearly
        auto_renew:
          type: boolean
          default: true
          description: Rinnovo automatico
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Data scadenza (opzionale)
        activation_metadata:
          description: Metadata attivazione
      required:
      - tier_id
    ActivateTierRequestBillingCycleEnum:
      enum:
      - monthly
      - yearly
      type: string
      description: |-
        * `monthly` - monthly
        * `yearly` - yearly
    AdminUserDashboardConfigCreate:
      type: object
      properties:
        user_id:
          type: integer
        area_id:
          type: integer
        widget_code:
          type: string
        visible:
          type: boolean
        order:
          type: integer
        config: {}
      required:
      - area_id
      - user_id
      - widget_code
    AdminUserDashboardConfigList:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        user_name:
          type: string
        area_id:
          type: integer
        area_name:
          type: string
        widget_code:
          type: string
        widget_name:
          type: string
        visible:
          type: boolean
        order:
          type: integer
        config: {}
      required:
      - area_id
      - area_name
      - config
      - id
      - order
      - user_id
      - user_name
      - visible
      - widget_code
      - widget_name
    AfternoonHours:
      type: object
      properties:
        is_open:
          type: boolean
        opening_time:
          type: string
          format: time
          nullable: true
        closing_time:
          type: string
          format: time
          nullable: true
        status:
          type: string
        is_special:
          type: boolean
      required:
      - closing_time
      - is_open
      - is_special
      - opening_time
      - status
    AfternoonScheduleCreate:
      type: object
      properties:
        work:
          type: boolean
        start_time:
          type: string
          format: time
          nullable: true
        end_time:
          type: string
          format: time
          nullable: true
      required:
      - work
    AfternoonScheduleUpdate:
      type: object
      properties:
        work:
          type: boolean
        start_time:
          type: string
          format: time
          nullable: true
        end_time:
          type: string
          format: time
          nullable: true
      required:
      - work
    AreaBasic:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    AreaConfig:
      type: object
      description: Configurazione area per creazione tenant
      properties:
        name:
          type: string
          description: Nome dell'area
          maxLength: 100
        description:
          type: string
      required:
      - name
    AreaData:
      type: object
      properties:
        id:
          type: integer
          description: Area ID
        name:
          type: string
          description: Area name
        active_operators:
          type: array
          items:
            $ref: '#/components/schemas/AreaOperatorSecondary'
          description: List of active operators in this area
        active_workstations:
          type: array
          items:
            $ref: '#/components/schemas/AreaWorkstation'
          description: List of active workstations in this area
      required:
      - active_operators
      - active_workstations
      - id
      - name
    AreaDetailsResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Request status
        areas:
          type: array
          items:
            $ref: '#/components/schemas/AreaData'
          description: List of areas with their operators and workstations
      required:
      - areas
      - success
    AreaHours:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        is_open:
          type: boolean
        has_daily_schedule:
          type: boolean
        reason_status:
          type: string
        morning:
          $ref: '#/components/schemas/MorningHours'
        afternoon:
          $ref: '#/components/schemas/AfternoonHours'
        notes:
          type: string
          nullable: true
        has_holiday:
          type: boolean
        has_special_closing:
          type: boolean
        has_special_opening:
          type: boolean
      required:
      - afternoon
      - has_daily_schedule
      - has_holiday
      - has_special_closing
      - has_special_opening
      - id
      - is_open
      - morning
      - name
      - notes
      - reason_status
    AreaInfo:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    AreaOperator:
      type: object
      properties:
        operator_id:
          type: integer
        operator_name:
          type: string
        operator_type:
          type: string
          description: 'Tipo operatore: "operator" o "operator_authorized"'
        workstation_ids:
          type: array
          items:
            type: integer
          description: Array degli ID delle workstation su cui l'operatore è abilitato
        attachment_url:
          type: string
          nullable: true
          description: URL signed dell'immagine profilo dell'operatore
      required:
      - operator_id
      - operator_name
      - operator_type
      - workstation_ids
    AreaOperatorSecondary:
      type: object
      properties:
        id:
          type: integer
          description: Operator ID
        name:
          type: string
          description: Operator name
        photo:
          type: string
          description: Operator photo URL
        role:
          type: string
          description: Operator role
      required:
      - id
      - name
      - role
    AreaSchedule:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        main_area:
          type: boolean
        operators:
          type: array
          items:
            $ref: '#/components/schemas/AreaOperator'
        working_days:
          type: array
          items:
            $ref: '#/components/schemas/WorkingDay'
      required:
      - id
      - main_area
      - name
      - operators
      - working_days
    AreaWorkstation:
      type: object
      properties:
        id:
          type: integer
          description: Workstation ID
        name:
          type: string
          description: Workstation name
      required:
      - id
      - name
    AreasWithOperatorSchedule:
      type: object
      properties:
        areas:
          type: array
          items:
            $ref: '#/components/schemas/AreaSchedule'
        performance:
          $ref: '#/components/schemas/PerformanceInfo'
      required:
      - areas
      - performance
    AuthorizationRequirement:
      type: object
      properties:
        id:
          type: integer
        resource:
          type: string
        action:
          type: string
        required:
          type: boolean
        description:
          type: string
      required:
      - action
      - description
      - id
      - required
      - resource
    AvailabilityRequest:
      type: object
      properties:
        operator_id:
          type: integer
          description: ID dell'operatore (single operator mode)
        primaryOperatorId:
          type: integer
          description: ID dell'operatore primario (dual operators mode)
        additionalOperatorId:
          type: integer
          description: ID dell'operatore addizionale (dual operators mode)
        area_id:
          type: integer
          description: ID dell'area
        primaryServiceId:
          type: integer
          description: ID del servizio principale
        additionalServiceId:
          type: integer
          description: ID del servizio aggiuntivo (obbligatorio per dual operators)
        timesPrimaryService:
          type: array
          items: {}
          description: Tempi per il servizio principale
        timesAdditionalService:
          type: array
          items: {}
          description: Tempi per il servizio aggiuntivo
        avaibleWorkStationsPrimaryService:
          type: array
          items:
            type: string
          description: Lista delle postazioni disponibili per il servizio principale
        avaibleWorkStationsAdditionalService:
          type: array
          items:
            type: string
          description: Lista delle postazioni disponibili per il servizio aggiuntivo
        workingDays:
          type: object
          additionalProperties: {}
          description: Giorni lavorativi
        primaryOperatorWorkingDays:
          type: object
          additionalProperties: {}
          description: 'Orari specifici per operatore primario (opzionale, default:
            workingDays)'
        additionalOperatorWorkingDays:
          type: object
          additionalProperties: {}
          description: 'Orari specifici per operatore addizionale (opzionale, default:
            workingDays)'
        minimumGapSlots:
          type: integer
          minimum: 0
          description: Slot minimi di gap tra prenotazioni. Gap deve essere 0 o >=
            valore specificato. Se non specificato, nessun controllo gap.
        searchOnlyMorning:
          type: boolean
          default: false
          description: Cerca disponibilità solo nel periodo mattino
        searchOnlyAfternoon:
          type: boolean
          default: false
          description: Cerca disponibilità solo nel periodo pomeriggio
      required:
      - area_id
      - avaibleWorkStationsPrimaryService
      - primaryServiceId
      - timesPrimaryService
      - workingDays
    AvailabilityResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Stato della richiesta
        data:
