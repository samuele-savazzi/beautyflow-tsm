openapi: 3.0.3
info:
  title: BeuatyFlow
  version: 1.0.0
  description: Descrizione api di BeuatyFlow
paths:
  /admin-api/admins/:
    get:
      operationId: admin_api_admins_retrieve
      description: Lista tutti i TenantAdmin con paginazione e filtri (solo per role='admin')
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filtra per stato attivo
      - in: query
        name: page
        schema:
          type: integer
        description: 'Numero pagina (default: 1)'
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Risultati per pagina (default: 20, max: 100)'
      - in: query
        name: role
        schema:
          type: string
        description: Filtra per ruolo (admin, commerciale, support)
      - in: query
        name: search
        schema:
          type: string
        description: Cerca per email o nome
      tags:
      - TenantAdmin Management
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminListResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    post:
      operationId: admin_api_admins_create
      description: "\n    **Crea un nuovo TenantAdmin** (solo per role='admin').\n\
        \n    ### Operazioni eseguite:\n    1. Creazione User Django (username = email)\n\
        \    2. Creazione TenantAdmin con password randomica\n    3. Imposta `must_change_password=True`\
        \ (cambio obbligatorio al primo login)\n    4. Imposta `totp_enabled=False`\
        \ (setup 2FA obbligatorio al primo login)\n    5. Invia email con credenziali\
        \ temporanee\n    6. Crea audit log\n\n    ### Password Generata:\n    - Lunghezza:\
        \ 12 caratteri\n    - Contiene: maiuscole, minuscole, numeri, caratteri speciali\n\
        \    - Mostrata SOLO in questa response (non recuperabile dopo)\n\n    ###\
        \ Email Inviata:\n    Contiene:\n    - Credenziali di accesso\n    - Istruzioni\
        \ primo login\n    - Warning sicurezza\n    - Link accesso\n\n    ### Primo\
        \ Login Flow:\n    1. Login con credenziali temporanee\n    2. Setup 2FA obbligatorio\
        \ (scansione QR code)\n    3. Cambio password obbligatorio\n    4. Accesso\
        \ completo\n\n    ### Audit Log:\n    Crea automaticamente audit log con action\
        \ `create_tenant_admin`\n    "
      tags:
      - TenantAdmin Management
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateTenantAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTenantAdminRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTenantAdminResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/admins/{admin_id}/:
    get:
      operationId: admin_api_admins_retrieve_2
      description: Dettagli completi di un TenantAdmin specifico (solo per role='admin')
      parameters:
      - in: path
        name: admin_id
        schema:
          type: integer
        required: true
      tags:
      - TenantAdmin Management
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantAdminDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/auth/change-password/:
    post:
      operationId: admin_api_auth_change_password_create
      description: "\n    **Cambio password per TenantAdmin autenticato.**\n\n   \
        \ ### Validazioni:\n    - Password attuale corretta\n    - Nuova password\
        \ ≥ 8 caratteri\n    - Nuova password contiene almeno 1 numero e 1 lettera\n\
        \    - Conferma password match\n\n    ### Comportamento:\n    - Se `must_change_password=True`\
        \ (primo login), viene impostato a `False`\n    - Invia email notifica cambio\
        \ password\n    - Crea audit log\n\n    ### Use Case:\n    1. **Primo login**:\
        \ Cambio password obbligatorio (must_change_password=True)\n    2. **Cambio\
        \ volontario**: Admin vuole cambiare password\n\n    ### Note:\n    - NON\
        \ invalida i token JWT esistenti (usare logout esplicito se necessario)\n\
        \    - Password storicizzata nell'user Django\n    "
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/auth/disable-2fa/:
    post:
      operationId: admin_api_auth_disable_2fa_create
      description: Disabilita 2FA (richiede password per sicurezza).
      summary: Disabilita 2FA
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Disable2FARequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Disable2FARequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Disable2FARequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/auth/login/:
    post:
      operationId: admin_api_auth_login_create
      description: "\nLogin FASE 1 per TenantAdmin.\n\n- **Se 2FA disabilitato**:\
        \ ritorna JWT completo (access + refresh)\n- **Se 2FA abilitato**: ritorna\
        \ JWT temporaneo per chiamare verify-2fa-login\n        "
      summary: Login TenantAdmin
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/auth/profile/:
    get:
      operationId: admin_api_auth_profile_retrieve
      description: "\n    **Ottieni profilo TenantAdmin autenticato.**\n\n    ###\
        \ Response Include:\n    - Dettagli completi TenantAdmin\n    - `requires_password_change`:\
        \ True se must_change_password=True\n    - `requires_2fa_setup`: True se totp_enabled=False\n\
        \    - `session_info`: IP, user-agent, etc.\n\n    ### Use Case:\n    Dopo\
        \ login/2FA, frontend può controllare se:\n    1. Deve cambiare password (primo\
        \ login)\n    2. Deve configurare 2FA\n\n    E mostrare UI appropriata.\n\
        \    "
      tags:
      - Auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/auth/refresh/:
    post:
      operationId: admin_api_auth_refresh_create
      description: "\nRinnova access token usando refresh token.\n\nCon **ROTATE_REFRESH_TOKENS=True**,\
        \ ritorna **NUOVO** refresh token.\nIl vecchio refresh token viene **blacklistato**.\n\
        \nMantiene i custom claims (2fa_verified, admin_id, admin_role, email).\n\
        \    "
      summary: Refresh JWT token
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/auth/regenerate-backup-codes/:
    post:
      operationId: admin_api_auth_regenerate_backup_codes_create
      description: Rigenera backup codes (invalida i precedenti). Richiede codice
        TOTP corrente.
      summary: Rigenera backup codes
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegenerateBackupCodesRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegenerateBackupCodesRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegenerateBackupCodesRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegenerateBackupCodesResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/auth/setup-2fa/:
    post:
      operationId: admin_api_auth_setup_2fa_create
      description: Genera QR code per setup TOTP (Google Authenticator). Richiede
        autenticazione JWT.
      summary: Setup 2FA
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Setup2FAResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/auth/verify-2fa-login/:
    post:
      operationId: admin_api_auth_verify_2fa_login_create
      description: "\nLogin FASE 2: Verifica codice 2FA e ritorna JWT completo.\n\n\
        Invia il **temporary_token** ricevuto da `/login/` nell'header Authorization.\n\
        Fornisci **code** (TOTP) oppure **backup_code**.\n    "
      summary: Verifica 2FA dopo login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verify2FACodeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verify2FACodeRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Verify2FACodeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verify2FALoginResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/auth/verify-2fa-setup/:
    post:
      operationId: admin_api_auth_verify_2fa_setup_create
      description: Verifica codice TOTP e attiva 2FA. Genera 8 backup codes.
      summary: Verifica e attiva 2FA
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Verify2FASetupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Verify2FASetupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Verify2FASetupRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verify2FASetupResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/tenants/:
    post:
      operationId: admin_api_tenants_create
      description: "\n    **Crea un nuovo tenant completo seguendo RUOTINE_CREAZIONE_TENANT.**\n\
        \n    ### Operazioni eseguite:\n    1. **Creazione tenant** + schema PostgreSQL\
        \ (django-tenants)\n    2. **Setup PUBLIC schema**: StepTemplate (8), FlowTemplate\
        \ (3), TenantQuota, TenantHistoryPayments\n    3. **Setup TENANT schema**:\n\
        \       - 5 Roles (admin, Operatore, Operatore autorizzato, Titolare, Segreteria)\n\
        \       - Admin user con password temporanea: `ChangeMe123!` ⚠️\n       -\
        \ N Aree + DailySchedule (7 giorni per area)\n       - 7 NotificationTypes\n\
        \       - 4 DashboardWidgets + RoleDashboardConfiguration\n\n    ### Billing\
        \ Flessibile:\n    - **trial**: 30 giorni gratuiti\n    - **monthly**: 1 mese\
        \ (30 giorni)\n    - **yearly**: 1 anno o `billing_duration` anni\n    - **custom**:\
        \ N anni (specificare `billing_duration`)\n\n    ### Upload Immagini (opzionali):\n\
        \    - **favicon**: PNG, ICO, SVG (max 2MB)\n    - **logo**: PNG, JPG, SVG\
        \ (max 5MB)\n    - **dark_logo**: PNG, JPG, SVG (max 5MB)\n\n    Salvate in\
        \ `media/favicon/` e `media/logo/`\n\n    ### Note importanti:\n    - **Password\
        \ admin**: `ChangeMe123!` (DEVE essere cambiata al primo login)\n    - **Main\
        \ area**: La prima area in `areas[]` sarà marcata come `main_area=True`\n\
        \    - **Warnings**: Eventuali errori non-bloccanti (es. Authorization mancante)\
        \ restituiti in array\n\n    ### Validazioni:\n    - Dominio univoco (non\
        \ può esistere già)\n    - Almeno 1 area richiesta\n    - QuotaType deve esistere\
        \ e essere attivo\n    - billing_duration obbligatorio per 'yearly' e 'custom'\n\
        \n    ### Audit log:\n    Crea automaticamente audit log con action `create_tenant`\n\
        \    "
      tags:
      - Tenant Management
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateTenantResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/tenants-list/:
    get:
      operationId: admin_api_tenants_list_retrieve
      description: Lista tutti i tenant con paginazione e filtri opzionali
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: 'Numero pagina (default: 1)'
      - in: query
        name: page_size
        schema:
          type: integer
        description: 'Risultati per pagina (default: 20, max: 100)'
      - in: query
        name: search
        schema:
          type: string
        description: Cerca per nome (case-insensitive)
      - in: query
        name: type
        schema:
          type: string
        description: Filtra per tipo (HAIRDRESSER, BARBER, BEAUTICIAN, SPA)
      tags:
      - Tenant Management
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantListResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/tenants/{tenant_id}/:
    get:
      operationId: admin_api_tenants_retrieve
      description: Dettagli completi di un tenant specifico
      parameters:
      - in: path
        name: tenant_id
        schema:
          type: integer
        required: true
      tags:
      - Tenant Management
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantInfo'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/tenants/{tenant_id}/tiers/:
    get:
      operationId: admin_api_tenants_tiers_list
      description: Lista tier attivi per un tenant specifico (solo per role='admin')
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
        description: Filtra per tier attivi
      - in: query
        name: is_trial
        schema:
          type: boolean
        description: Filtra per tier in trial
      - in: path
        name: tenant_id
        schema:
          type: integer
        required: true
      tags:
      - Tenant Tier Management
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TenantTierDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/tenants/{tenant_id}/tiers/{tier_id}/deactivate/:
    post:
      operationId: admin_api_tenants_tiers_deactivate_create
      description: "\n    **Disattiva Tier per un tenant** (solo per role='admin').\n\
        \n    ### Operazioni:\n    1. Imposta `is_active=False`\n    2. Imposta `cancelled_at=now()`\n\
        \    3. Crea audit log\n\n    ### Nota:\n    Il tier rimane nel database per\
        \ storico, ma non è più utilizzabile dal tenant.\n    "
      parameters:
      - in: path
        name: tenant_id
        schema:
          type: integer
        required: true
      - in: path
        name: tier_id
        schema:
          type: integer
        required: true
      tags:
      - Tenant Tier Management
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/tenants/{tenant_id}/tiers/{tier_id}/increment-usage/:
    post:
      operationId: admin_api_tenants_tiers_increment_usage_create
      description: "\n    **Incrementa usage count per tier con limite** (solo per\
        \ role='admin').\n\n    ### Operazioni:\n    - Incrementa `usage_count` di\
        \ 1\n    - Verifica se raggiunto il limite (`usage_count >= usage_limit`)\n\
        \    - Ritorna messaggio con usage status\n\n    ### Uso:\n    Da chiamare\
        \ quando il tenant utilizza una funzionalità limitata\n    (es. invia un messaggio\
        \ WhatsApp, genera un PDF, ecc.)\n    "
      parameters:
      - in: path
        name: tenant_id
        schema:
          type: integer
        required: true
      - in: path
        name: tier_id
        schema:
          type: integer
        required: true
      tags:
      - Tenant Tier Management
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /admin-api/tenants/{tenant_id}/tiers/{tier_id}/reset-usage/:
    post:
      operationId: admin_api_tenants_tiers_reset_usage_create
      description: "\n    **Reset usage count per tier** (solo per role='admin').\n\
        \n    ### Operazioni:\n    - Imposta `usage_count=0`\n    - Aggiorna `usage_reset_date=now()`\n\
        \n    ### Uso:\n    Da chiamare all'inizio di un nuovo periodo billing\n \
        \   (es. inizio mese per tier mensili)\n    "
      parameters:
      - in: path
        name: tenant_id
        schema:
          type: integer
        required: true
      - in: path
        name: tier_id
        schema:
          type: integer
        required: true
      tags:
      - Tenant Tier Management
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '403':
